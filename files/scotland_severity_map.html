<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plastic pollution severity on Scottish beaches</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html, body { height: 100%; margin: 0; }
#map { height: 100%; width: 100%; }
.legend { background: rgba(255,255,255,0.92); padding: 10px 12px; border-radius: 6px; box-shadow: 0 1px 5px rgba(0,0,0,.3); font: 12px/1.6 Helvetica, Arial, sans-serif; color: #222; }
.legend .bar { width: 150px; height: 10px; border-radius: 2px; }
.legend .labels { display: flex; justify-content: space-between; margin-top: 3px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="legend" style="position:absolute; bottom:20px; left:12px; z-index:1000;"><b>Pollution severity score</b><br><div class="bar" style="background:linear-gradient(to right, #440154, #472777, #3e4989, #30678d, #25828e, #1e9d88, #35b778, #6dce58, #b5dd2b, #fde724);"></div><div class="labels"><span>lower (0.001)</span><span>higher (0.804)</span></div><div style="margin-top:4px;">Circle size &amp; colour scale with score.</div></div>
<script>
var map = L.map('map').setView([56.5, -4.0], 6);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(map);
var data = [{"lat": 55.6256, "lon": -4.7497, "name": "Ardeer Beach", "s": 0.125, "color": "#453580", "radius": 9.84}, {"lat": 56.5184, "lon": -6.8842, "name": "Balephetrish Bay", "s": 0.014, "color": "#45065a", "radius": 3.3}, {"lat": 56.4776, "lon": -6.9771, "name": "Balephuil", "s": 0.036, "color": "#471163", "radius": 5.31}, {"lat": 56.4826, "lon": -6.9774, "name": "Barrapoll", "s": 0.187, "color": "#3d4c89", "radius": 12.05}, {"lat": 55.8745, "lon": -6.1168, "name": "Bunnahabhain", "s": 0.014, "color": "#45065a", "radius": 3.33}, {"lat": 56.5442, "lon": -6.7425, "name": "Caolas", "s": 0.002, "color": "#440154", "radius": 1.39}, {"lat": 55.3086, "lon": -5.6737, "name": "Carskey Bay", "s": 0.001, "color": "#440154", "radius": 0.98}, {"lat": 56.4921, "lon": -6.8582, "name": "Crossapol", "s": 0.03, "color": "#460e61", "radius": 4.86}, {"lat": 56.4485, "lon": -5.6593, "name": "Duart Bay ", "s": 0.004, "color": "#440255", "radius": 1.85}, {"lat": 55.4053, "lon": -4.7615, "name": "Dunure", "s": 0.012, "color": "#450558", "radius": 3.06}, {"lat": 56.3844, "lon": -5.5226, "name": "Gallanach Road", "s": 0.06, "color": "#481a6c", "radius": 6.83}, {"lat": 55.2416, "lon": -4.8604, "name": "Girvan Bay", "s": 0.071, "color": "#482071", "radius": 7.41}, {"lat": 56.5275, "lon": -6.7837, "name": "Gott Bay", "s": 0.055, "color": "#48196b", "radius": 6.56}, {"lat": 55.6445, "lon": -5.4822, "name": "Grogport", "s": 0.011, "color": "#450558", "radius": 2.94}, {"lat": 55.931, "lon": -4.8768, "name": "Lunderston Bay", "s": 0.2, "color": "#3b518a", "radius": 12.48}, {"lat": 55.4238, "lon": -5.731, "name": "Machrihanish ", "s": 0.015, "color": "#45065a", "radius": 3.41}, {"lat": 56.55, "lon": -6.7593, "name": "Miodar", "s": 0.009, "color": "#440357", "radius": 2.67}, {"lat": 57.338, "lon": -6.1095, "name": "Ollach Bay", "s": 0.043, "color": "#471466", "radius": 5.81}, {"lat": 55.6844, "lon": -6.5125, "name": "Portnahaven", "s": 0.136, "color": "#433a83", "radius": 10.3}, {"lat": 57.284, "lon": -6.4569, "name": "Talisker Bay ", "s": 0.348, "color": "#267f8e", "radius": 16.46}, {"lat": 56.5294, "lon": -6.228, "name": "The Black Beach", "s": 0.804, "color": "#fde724", "radius": 25.0}, {"lat": 56.2892, "lon": -6.2188, "name": "Uisken Bay", "s": 0.038, "color": "#471163", "radius": 5.42}];
data.forEach(function(d){
  L.circleMarker([d.lat, d.lon], {
    radius: d.radius, color: d.color, fillColor: d.color, fillOpacity: 0.75, weight: 1
  }).addTo(map)
    .bindPopup('<b>' + d.name + '</b><br><b>Severity score:</b> ' + d.s, { maxWidth: 250 })
    .bindTooltip(d.name + ' | ' + d.s);
});
</script>
</body>
</html>
